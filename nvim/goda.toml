[[plugins]]
repo = 'Shougo/goda.vim'

[[plugins]]
repo = 'Shougo/goda-pm.vim'

[[plugins]]
repo = 'Shougo/goda-pm-ext-lazy.vim'

[[plugins]]
repo = 'Shougo/goda-cmp.vim'
hook_add = '''
  autocmd VimEnter * call goda_cmp#enable()
  " 補完の候補の移動と確定。ポップアップが出ていないときは元のキーとして動く
  inoremap <expr> <C-j> pumvisible() ? "\<C-n>" : "\<C-j>"
  inoremap <expr> <C-k> pumvisible() ? "\<C-p>" : "\<C-k>"
  inoremap <expr> <Tab> pumvisible() ? "\<C-n>" : "\<Tab>"
  " 候補を選んでいないときは、ポップアップを閉じずに改行する
  inoremap <expr> <CR>  pumvisible() && complete_info(['selected']).selected != -1 ? "\<C-y>" : "\<CR>"
'''
hook_post_update = '''
  call goda_cmp#build()
'''

[[plugins]]
repo = 'Shougo/goda-cmp-ui-native.vim'

[[plugins]]
repo = 'Shougo/goda-fi.vim'
hook_add = '''
  nnoremap <Leader>f <Cmd>call goda_fi#start({'sources': ['filerec']})<CR>
'''
hook_post_update = '''
  call goda_fi#build()
'''

[[plugins]]
repo = 'Shougo/goda-fi-ui-ff.vim'

[[plugins]]
repo = 'neovim/nvim-lspconfig'
# LSP。対象のファイルを開いたときに読み込む。サーバの起動設定は lspconfig の lsp/*.lua を使う
lazy = true # goda-pm/main.go が既定値を lazy=false にしているので明示する
on_ft = ['go', 'gomod', 'gowork', 'gotmpl', 'lua']
lua_source = '''
  vim.lsp.config("gopls", { settings = { gopls = {
    gofumpt = true, -- gofmt より厳しい gofumpt で整形する
    staticcheck = true, -- staticcheck の解析も診断に出す
  } } })
  -- Lua は Neovim 用だけ書く前提。LuaJIT として解析し、vim.* の型は $VIMRUNTIME から読む
  vim.lsp.config("lua_ls", { settings = { Lua = {
    runtime = { version = "LuaJIT" },
    workspace = { checkThirdParty = false, library = { vim.env.VIMRUNTIME } },
  } } })
  -- 読み込みは FileType の途中になるが、enable が開いているバッファにも FileType を送り直す
  vim.lsp.enable({ "gopls", "lua_ls" })
'''
